name: 29883_test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  job1_preveri:
    runs-on: ubuntu-latest

    steps:
      - name: Prenesi repozitorij
        uses: actions/checkout@v4

      - name: Preveri ali obstajajo testi
        run: |
          : > napaka.txt

          if ls test_*.py 1> /dev/null 2>&1; then
            echo "Testne datoteke obstajajo."
          else
            echo "NAPAKA: Testne datoteke ne obstajajo." > napaka.txt
          fi

      - name: Shrani napaka.txt kot artefakt
        uses: actions/upload-artifact@v4
        with:
          name: napaka
          path: napaka.txt

  job2_testiraj:
    needs: job1_preveri
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Prenesi repozitorij
        uses: actions/checkout@v4

      - name: Prenesi artefakt
        uses: actions/download-artifact@v4
        with:
          name: napaka

      - name: Preveri napaka.txt iz prvega posla
        run: |
          if [ -s napaka.txt ]; then
            echo "Prvi job je našel napako:"
            cat napaka.txt
            exit 1
          fi

      - name: Nastavi Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Namesti odvisnosti
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zaženi teste
        run: |
          : > napaka.txt
          pytest || echo "NAPAKA: Testi niso uspešni." > napaka.txt

      - name: Preveri rezultate testov
        run: |
          if [ -s napaka.txt ]; then
            cat napaka.txt
            exit 1
          fi

          echo "Vsi testi so uspešni."
